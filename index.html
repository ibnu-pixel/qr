<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kartu Digital | QR Code</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#e9f0ff;background:#0a1020}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#20365e,#0a1020 65%)}.card{width:min(100%,450px);background:#151e32;border:1px solid #30415e;border-radius:22px;padding:32px;text-align:center;box-shadow:0 20px 70px #0005}h1{font-size:26px;margin:10px 0}p{color:#aebcd4;line-height:1.55}.tag{color:#93b4ff;font-size:13px;letter-spacing:2px;font-weight:700}.qr{background:white;border-radius:16px;margin:22px auto;padding:16px;width:fit-content;min-height:232px;display:grid;place-items:center}.qr img{width:200px;height:200px;display:block}.btn{display:block;width:100%;background:#5887ff;color:#fff;border:0;border-radius:11px;padding:15px;font-weight:700;text-decoration:none;cursor:pointer;font-size:15px;margin-top:12px}.btn.alt{background:#283954}.btn:disabled{opacity:.6;cursor:not-allowed}.hidden{display:none}.id{font-weight:700;color:#fff}.note{font-size:12px;margin-top:18px}#error{color:#ffb5b5}
</style></head><body><main class="card"><div class="tag">KARTU DIGITAL</div><h1>QR Code Untukmu</h1><p id="status">Sedang menyiapkan satu kode unik...</p><div id="result" class="hidden"><div class="qr"><img id="qr" alt="QR Code kartu"></div><div class="id" id="cardId"></div><a class="btn" id="open" target="_blank" rel="noopener noreferrer">Buka Link Kartu ↗</a><button class="btn alt" id="share">Bagikan via WhatsApp</button><p class="note">Simpan kode ini. Refresh halaman tidak akan mengambil kartu baru di perangkat yang sama selama data browser tersimpan.</p></div><p id="error"></p></main><script>
// PASTE URL WEB APP GOOGLE APPS SCRIPT DI SINI (harus berakhir /exec).
const SCRIPT_URL='PASTE_URL_APPS_SCRIPT_DI_SINI';
const STORAGE_KEY='qr-distributor-claim-v1';
const statusEl=document.getElementById('status'),errorEl=document.getElementById('error'),result=document.getElementById('result');
function render(card){if(!card||!card.tautan||!/^https:\/\//i.test(card.tautan))throw Error('Data kartu tidak valid');document.getElementById('cardId').textContent=card.nomor_kartu;document.getElementById('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent(card.tautan);document.getElementById('open').href=card.tautan;document.getElementById('share').onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent('Kartu '+card.nomor_kartu+'\n'+card.tautan),'_blank','noopener');result.classList.remove('hidden');statusEl.textContent='Kode unik berhasil dialokasikan untukmu.';}
async function start(){try{const saved=localStorage.getItem(STORAGE_KEY);if(saved){render(JSON.parse(saved));return;}if(!SCRIPT_URL.startsWith('https://script.google.com/macros/s/'))throw Error('Admin belum mengatur URL Google Apps Script.');const res=await fetch(SCRIPT_URL+'?action=claim',{redirect:'follow'});if(!res.ok)throw Error('Server tidak dapat diakses.');const data=await res.json();if(!data.ok)throw Error(data.error||'Stok habis');localStorage.setItem(STORAGE_KEY,JSON.stringify(data));render(data);}catch(e){statusEl.textContent='Belum bisa menampilkan QR Code.';errorEl.textContent=e.message;}}
start();
</script></body></html>
