const STORAGE_KEY='qr-distributor-claim-v1';
const statusEl=document.getElementById('status'),errorEl=document.getElementById('error'),result=document.getElementById('result');
function render(card){if(!card||!card.tautan||!/^https:\/\//i.test(card.tautan))throw Error('Data kartu tidak valid');document.getElementById('cardId').textContent=card.nomor_kartu;document.getElementById('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent(card.tautan);document.getElementById('open').href=card.tautan;document.getElementById('share').onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent('Kartu '+card.nomor_kartu+'\n'+card.tautan),'_blank','noopener');result.classList.remove('hidden');statusEl.textContent='SCAN TO ENTER THE MAGIC';}
let busy=false;
async function claimNew(){
  if(busy)return;
  busy=true;
  const btn=document.getElementById('next');btn.disabled=true;
  errorEl.textContent='';statusEl.textContent='Sedang mengambil QR Code baru...';
  try{
    if(!SCRIPT_URL.startsWith('https://script.google.com/macros/s/'))throw Error('Admin belum mengatur URL Google Apps Script.');
    const res=await fetch(SCRIPT_URL+'?action=claim&t='+Date.now(),{redirect:'follow',cache:'no-store'});
    if(!res.ok)throw Error('Server tidak dapat diakses.');
    const data=await res.json();
    if(!data.ok)throw Error(data.error||'Stok habis');
    render(data);
    localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
  }catch(e){statusEl.textContent=result.classList.contains('hidden')?'Belum bisa menampilkan QR Code.':'QR terakhir masih ditampilkan.';errorEl.textContent=e.message;}
  finally{busy=false;btn.disabled=false;}
}
function start(){
  try{
    const saved=localStorage.getItem(STORAGE_KEY);
    if(saved){render(JSON.parse(saved));return;}
  }catch(e){localStorage.removeItem(STORAGE_KEY);}
  claimNew();
}
document.getElementById('next').addEventListener('click',()=>{
  if(confirm('Ambil QR baru? QR sebelumnya tetap dianggap sudah dibagikan dan tidak dapat dikembalikan ke stok.'))claimNew();

start();
